<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Sanctuary — Spirituel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/spirituel.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/darkmode.css">
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>

    <header>
      <div>
        <div class="logo">Sanctuary</div>
        <div class="logo-sub">Your home, harmonized</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button onclick="toggleMode()" class="btn-mode" id="btn-mode">🌙</button>
        <div class="avatar" id="user-avatar">👤</div>
      </div>
    </header>

    <main>

      <section>
        <h2>Vie spirituelle</h2>
        <p style="color:var(--texte-doux);font-size:13px;">
          Nourrissez votre âme chaque jour
        </p>
      </section>

      <!-- VERSET DU JOUR -->
      <div class="verset-glass">
        <div class="verset-label">✦ Verset du jour</div>
        <div id="verset-texte" class="verset-text">Chargement...</div>
        <div id="verset-ref" class="verset-ref">—</div>
        <button onclick="nouveauVerset()" class="btn-nouveau-verset">
          ↻ Autre verset
        </button>
      </div>

      <!-- IA SPIRITUEL -->
      <section class="ia-section">
        <h3>🙏 Compagnon biblique</h3>
        <p>Posez une question sur la Bible...</p>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="ia-spirituel-question" type="text"
            placeholder="Ex: que dit la Bible sur l'inquiétude ?">
          <button onclick="demanderIASpirituel()">→</button>
        </div>
        <div id="ia-spirituel-reponse" class="ia-reponse" style="display:none;">
          <button onclick="fermerIA('ia-spirituel-reponse')"
            class="btn-fermer-ia">✕</button>
          <div id="ia-spirituel-reponse-texte"></div>
        </div>
      </section>

    </main>

    <nav>
      <a href="/index.html"><span>🏠</span><span>Accueil</span></a>
      <a href="/taches.html"><span>✓</span><span>Tâches</span></a>
      <a href="/agenda.html"><span>📅</span><span>Agenda</span></a>
      <a href="/budget.html"><span>💰</span><span>Budget</span></a>
      <a href="/cuisine.html"><span>🍽</span><span>Cuisine</span></a>
      <a href="/sport.html"><span>🏃</span><span>Sport</span></a>
      <a href="/spirituel.html" class="nav-actif"><span>✝</span><span>Spirituel</span></a>
    </nav>

    <!-- SCRIPTS dans le bon ordre -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/darkmode.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/spirituel.js"></script>
    <script src="/js/notifications.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await verifierAuth();
        await initHeader();
      });
    </script>

  </body>
</html>
