<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Sanctuary — Cuisine</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cuisine.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/darkmode.css">
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>

    <header>
      <div>
        <div class="logo">Sanctuary</div>
        <div class="logo-sub">Your home, harmonized</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button onclick="toggleMode()" class="btn-mode" id="btn-mode">🌙</button>
        <div class="avatar" id="user-avatar">👤</div>
      </div>
    </header>

    <main>

      <section>
        <h2>Bienvenue en cuisine</h2>
        <p style="color:var(--texte-doux);font-size:13px;">
          L'art de nourrir votre foyer
        </p>
      </section>

      <!-- CATÉGORIES -->
      <section>
        <h3>Catégories</h3>
        <div class="categories">
          <button class="cat-btn actif" onclick="filtrer('tout')">Tout</button>
          <button class="cat-btn" onclick="filtrer('enfants')">👶 Enfants</button>
          <button class="cat-btn" onclick="filtrer('poids')">🥗 Perte de poids</button>
          <button class="cat-btn" onclick="filtrer('invites')">🌍 Invités</button>
          <button class="cat-btn" onclick="filtrer('desserts')">🍰 Desserts</button>
          <button class="cat-btn" onclick="filtrer('boissons')">🥤 Boissons</button>
          <button class="cat-btn" onclick="filtrer('dejeuner')">☕ Petit-déjeuner</button>
        </div>
      </section>

      <!-- AJOUTER UNE RECETTE -->
      <section>
        <h3>Ajouter une recette</h3>
        <div class="form-recette">
          <input id="rec-nom" type="text" placeholder="Nom de la recette">
          <select id="rec-cat">
            <option value="enfants">👶 Enfants</option>
            <option value="poids">🥗 Perte de poids</option>
            <option value="invites">🌍 Invités</option>
            <option value="desserts">🍰 Desserts</option>
            <option value="boissons">🥤 Boissons</option>
            <option value="dejeuner">☕ Petit-déjeuner</option>
          </select>
          <textarea id="rec-ingredients"
            placeholder="Ingrédients (un par ligne)..."
            rows="3"></textarea>

          <!-- APERÇU PHOTO -->
          <div id="photo-preview" style="display:none;">
            <img id="photo-preview-img" src="" alt="aperçu"
              style="width:100%;height:140px;object-fit:cover;
              border-radius:12px;margin-bottom:8px;">
          </div>

          <label class="label-photo" for="rec-photo">
            <span>📷</span>
            <span id="photo-label-texte">Ajouter une photo de la recette</span>
          </label>
          <input id="rec-photo" type="file" accept="image/*"
            onchange="previewPhoto(this)">

          <button onclick="ajouterRecette()">Ajouter la recette ✓</button>
        </div>
      </section>

      <!-- MES RECETTES -->
      <section>
        <h3>Mes recettes</h3>
        <div id="grille-recettes" class="grille-recettes"></div>
      </section>

      <!-- IA CUISINE -->
      <section class="ia-section">
        <h3>👩‍🍳 Assistante cuisine</h3>
        <p>Posez une question : que cuisiner ce soir, idées légères...</p>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="ia-question" type="text"
            placeholder="Ex: idée de repas léger pour ce soir...">
          <button onclick="demanderIA()">→</button>
        </div>
        <div id="ia-reponse" class="ia-reponse" style="display:none;">
          <button onclick="fermerIA('ia-reponse')"
            class="btn-fermer-ia">✕</button>
          <div id="ia-reponse-texte"></div>
        </div>
      </section>

    </main>

    <nav>
      <a href="/index.html"><span>🏠</span><span>Accueil</span></a>
      <a href="/taches.html"><span>✓</span><span>Tâches</span></a>
      <a href="/agenda.html"><span>📅</span><span>Agenda</span></a>
      <a href="/budget.html"><span>💰</span><span>Budget</span></a>
      <a href="/cuisine.html" class="nav-actif"><span>🍽</span><span>Cuisine</span></a>
      <a href="/sport.html"><span>🏃</span><span>Sport</span></a>
      <a href="/spirituel.html"><span>✝</span><span>Spirituel</span></a>
    </nav>

    <!-- SCRIPTS dans le bon ordre -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/darkmode.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/cuisine.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await verifierAuth();
        await initHeader();
      });
    </script>

  </body>
</html>
